<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MaxTrack | AI-Powered Rail Block Planning (SIH PS 26027)</title>
  <link rel="icon" type="image/svg+xml" href="/assets/ir_logo.svg">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
  <div class="app-layout">
    <!-- Clean Minimalist Vertical Left Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header" id="navBrand" style="cursor: pointer;">
        <img src="/assets/ir_logo.svg" alt="Indian Railways Insignia" class="sidebar-brand-img">
        <div class="sidebar-brand-text">
          <span class="brand-title">IR-ABPS | MAXTRACK</span>
          <span class="brand-subtitle">CRIS • SIH PS 26027</span>
        </div>
      </div>

      <!-- Vertical Feature Tabs -->
      <nav class="sidebar-nav">
        <button class="nav-item-btn active" data-module="command_center">
          <span class="nav-icon">⚡</span>
          <span>Command Center</span>
        </button>
        <button class="nav-item-btn" data-module="data_bridge">
          <span class="nav-icon">🗄</span>
          <span>Data Bridge</span>
        </button>
        <button class="nav-item-btn" data-module="ai_prioritization">
          <span class="nav-icon">🧠</span>
          <span>AI Prioritization</span>
        </button>
        <button class="nav-item-btn" data-module="block_scheduler">
          <span class="nav-icon">📅</span>
          <span>Block Scheduler</span>
        </button>
        <button class="nav-item-btn" data-module="marey_chart">
          <span class="nav-icon">📈</span>
          <span>Marey Chart</span>
        </button>
        <button class="nav-item-btn" data-module="geo_map">
          <span class="nav-icon">🗺</span>
          <span>Corridor Map</span>
        </button>
        <button class="nav-item-btn" data-module="what_if_simulator">
          <span class="nav-icon">🧪</span>
          <span>What-If Simulator</span>
        </button>
        <button class="nav-item-btn" data-module="bdms_dispatch">
          <span class="nav-icon">📑</span>
          <span>CRIS Gateway</span>
        </button>
      </nav>

      <!-- Sidebar Footer (Corridor, Horizon & Re-Solve Action) -->
      <div class="sidebar-footer">
        <div class="sidebar-select-group">
          <label class="sidebar-select-label" for="corridorSelect">Corridor Subgraph</label>
          <select class="select-box-light" id="corridorSelect">
            <option value="NDLS-CNB">NDLS-CNB (HDN 440km)</option>
            <option value="DNR-PNBE">DNR-PNBE (Branch 10km)</option>
          </select>
        </div>

        <div class="sidebar-select-group">
          <label class="sidebar-select-label" for="horizonSelect">Planning Horizon</label>
          <select class="select-box-light" id="horizonSelect">
            <option value="weekly">Weekly (7-Day Rolling)</option>
            <option value="monthly">Monthly (30-Day Capital)</option>
          </select>
        </div>

        <button class="action-btn-sidebar" id="btnResolve">
          <span>⚡</span>
          <span>Re-Solve (CP-SAT)</span>
        </button>

        <div class="sidebar-solver-pill" id="sidebarSolverPill">
          <span>🟢</span>
          <span>CP-SAT OPTIMAL • 15m Headway</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="appContent"></main>
  </div>

  <!-- Module Script -->
  <script type="module" src="/app.js"></script>
</body>
</html>
